[DoubleSteering]
; Toggle double steering on/off
Enabled=1

; Partial-hold magnitude during non-spike frames (0-95%)
; 0 = fully release between spikes (classic), 40 = hold 40% lock
DeflectionPercent=40

; Spike magnitude as percentage of full lock (100-300)
; 150 = 1.5x full lock on spike frames
SpikeMagnitude=150

; Total frames per pulse cycle (2-60)
; Higher = gentler, lower = more aggressive
PulseInterval=6

; How many frames of the cycle are spike frames (1 to Interval-1)
PulseDuration=1

; Steering keys (Left, Right, or any key name / hex VK code)
KeyLeft=Left
KeyRight=Right

; Toggle hotkey
KeyToggle=F9
